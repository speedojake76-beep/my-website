<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Type Selection</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Font Awesome for icons (optional) -->
    <link rel="stylesheet" href="cdnjs.cloudflare.com">
</head>
<body>
    <link rel="stylesheet" href="page2.css">
    
    
    <div class="container">
        <h1 style="color: white;">Choose Your Access Type</h1>
        <p style="color:white">Select how you want to access CampusRepo</p>
        
        <div class="card-container">
            <!-- Public Access Card -->
            <div class="card">
                <div class="icon-circle">
                    <!-- Example icon, replace with your preferred icon class -->
                    <i class="fas fa-globe"></i> 
                </div>
                <h2>Public Access</h2>
                <p>Browse verified academic resources</p>
                <a href="#">Click to continue →</a>
            </div>

            <!-- Student Login Card -->
            <div class="card">
                <div class="icon-circle">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <h2>Student Login</h2>
                <p>Access resources from your department</p>
                <a href="#">Click to continue →</a>
            </div>

            <!-- Faculty Login Card -->
            <div class="card">
                <div class="icon-circle">
                    
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <h2>Faculty Login</h2>
                <p>Approve and manage academic content</p>
                <a href="#">Click to continue →</a>
            </div>
        </div>
    </div>
</body>
</html>
